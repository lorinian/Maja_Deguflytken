# Bygger spelet som ett fristående program för Windows, Mac och Linux.
# Körs när en tagg som v1.0 pushas (då skapas även en release med filerna),
# eller manuellt via fliken "Actions" -> "Bygg spelet" -> "Run workflow".
name: Bygg spelet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Bygg med PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name Degu-flykten
          --collect-all ursina --collect-all panda3d --collect-all direct
          degu_flykten.py

      - name: Packa (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Degu-flykten/* -DestinationPath Degu-flykten-windows.zip

      - name: Packa (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Degu-flykten.app Degu-flykten-mac.zip

      - name: Packa (Linux)
        if: runner.os == 'Linux'
        run: tar -czf Degu-flykten-linux.tar.gz -C dist Degu-flykten

      - uses: actions/upload-artifact@v4
        with:
          name: Degu-flykten-${{ matrix.name }}
          path: Degu-flykten-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: Degu-flykten-*
